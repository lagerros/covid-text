[tool.poetry]
name = "coron"
version = "0.1.0"
description = "A default visualization for covid-19 model"
authors = ["Daniel Hnyk <hnykda@gmail.com>"]
license = "BSD-4-Clause"
package-mode = false


[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.141.1"
jinja2 = "^3.1.6"
aiofiles = "^0.4.0"
uvicorn = "^0.54.0"
covid = {path = "src", develop = true}
pandas = "^2.3.3"


[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
isort = "^4.3.21"
pylint = "^2.4.4"
pytest = "^9.0.3"
httpx2 = "^2.13.1"
requests = "^2.31.0"
pandas = "^2.3.3"
pyarrow = "^25.0.1"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
